name: Duskweaver
version: '1.2.3'
main: com.iruixos.duskweaver.DuskweaverPlugin
api-version: '26.3'
author: iruixos
description: Weave time to your will. Customize daylight, darkness, and sleeping.
commands:
  duskweaver:
    description: Reload Duskweaver configuration.
    usage: /duskweaver reload
    aliases: [dw]
permissions:
  duskweaver.reload:
    description: Reload Duskweaver configuration.
    default: op
